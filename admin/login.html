<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administrateur — Maison Frère Mixage</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A0A0C' rx='20'/%3E%3Cpath d='M30 25h40v12H44v14h22v12H44v22H30V25z' fill='%23C5A059'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <style>
    body.login-page {
      background: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.08) 0%, #0A0A0C 70%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: var(--font-body);
      color: var(--text-main);
      margin: 0;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 18, 22, 0.95);
      border: 1px solid var(--gold-border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(212, 175, 55, 0.08);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gold-gradient);
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .login-emblem {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--gold-gradient);
      color: #0A0A0C;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    .login-brand-text {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #FFFFFF;
      text-align: left;
    }

    .login-brand-sub {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 600;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      color: #FFFFFF;
      margin: 0 0 0.5rem 0;
      font-weight: 600;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin: 0 0 2rem 0;
    }

    .login-form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .login-input-group {
      position: relative;
    }

    .login-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.45rem;
    }

    .login-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .login-input-icon {
      position: absolute;
      left: 14px;
      color: var(--gold);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .login-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      background: #0E0E12;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-family: var(--font-body);
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .login-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
      background: #14141A;
    }

    .login-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .btn-login {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 8px;
      background: var(--gold-gradient);
      color: #0A0A0C;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
      margin-top: 0.5rem;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.45);
      filter: brightness(1.08);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-forgot-link {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-decoration: none;
      margin-top: 0.5rem;
      display: inline-block;
      transition: color 0.2s;
    }

    .login-forgot-link:hover {
      color: var(--gold);
      text-decoration: underline;
    }

    .login-error-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #F87171;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
      text-align: left;
    }

    .login-footer-info {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-container">
    
    <!-- Logo Frère Mixage -->
    <div class="login-logo">
      <div class="login-emblem">FM</div>
      <div>
        <div class="login-brand-text">FRÈRE MIXAGE</div>
        <div class="login-brand-sub">Maison de Couture • Dakar</div>
      </div>
    </div>

    <h1 class="login-title">Connexion à votre espace</h1>
    <p class="login-subtitle">Accédez à la gestion des collections, stocks et commandes.</p>

    <!-- Message d'erreur dynamique -->
    <div id="login-error-box" class="login-error-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="login-error-text">Identifiants incorrects</span>
    </div>

    <!-- Formulaire de Connexion -->
    <form id="admin-login-form" class="login-form">
      
      <!-- Champ Numéro de Téléphone -->
      <div class="login-input-group">
        <label for="input-phone" class="login-label">Numéro de téléphone</label>
        <div class="login-input-wrap">
          <div class="login-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          </div>
          <input 
            type="tel" 
            id="input-phone" 
            class="login-input" 
            placeholder="+221 77 000 00 00" 
            autocomplete="tel"
            required 
          />
        </div>
      </div>

      <!-- Champ Mot de Passe -->
      <div class="login-input-group">
        <label for="input-password" class="login-label">Mot de passe</label>
        <div class="login-input-wrap">
          <div class="login-input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <input 
            type="password" 
            id="input-password" 
            class="login-input" 
            placeholder="••••••••••••" 
            autocomplete="current-password"
            required 
          />
        </div>
      </div>

      <!-- Bouton Se Connecter -->
      <button type="submit" id="btn-login-submit" class="btn-login">
        <span>Se connecter</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>

      <!-- Lien Mot de passe oublié -->
      <div style="text-align: center;">
        <a href="#" id="link-forgot-password" class="login-forgot-link">Mot de passe oublié ?</a>
      </div>

    </form>

    <div class="login-footer-info">
      Accès sécurisé réservé aux membres de la Maison Frère Mixage
    </div>

  </div>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
